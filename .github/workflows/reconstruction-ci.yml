name: Reconstruction CI

on:
  pull_request:
    branches:
      - reconstruction/canonical-2026-08-07
  push:
    branches:
      - reconstruction/canonical-2026-08-07

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: Node tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run Node tests
        run: npm run test:all

  web-production-build:
    name: Web production build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build Web production assets
        run: npm run build:web

  android-lint:
    name: Android lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          check-latest: false

      - name: Install dependencies
        run: npm ci

      - name: Build Web production assets for Capacitor
        run: npm run build:web

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Verify Capacitor sync did not modify tracked files
        run: git diff --exit-code

      - name: Run Android lint
        working-directory: android
        run: ./gradlew --no-daemon lintDebug
